syntax = "proto3";

option java_package = "com.sems.battery";
option java_outer_classname = "BatteryStorageProto";
option java_multiple_files = true;

// --- Service definition ---
service BatteryStorageService {
  rpc GetBatteryStatus (StatusRequest) returns (StatusResponse);
  rpc ReportChargeCycles (stream ChargeEvent) returns (ChargeSummary);
}

// --- Messages ---
message StatusRequest {
  string battery_id = 1;
}

message StatusResponse {
  string battery_id = 1;
  double capacity = 2;
  double current_level = 3;
  double health = 4;
}

message ChargeEvent {
  string battery_id = 1;
  double charge_percent = 2;   // 0.0–100.0
  bool is_charging = 3;        // true = charging, false = discharging
}

message ChargeSummary {
  string battery_id = 1;
  int32 total_events = 2;      // number of events processed
  double avg_charge = 3;       // average charge level over the session
}