syntax = "proto3";

option java_package = "com.sems.distribution";
option java_outer_classname = "EnergyDistributionProto";
option java_multiple_files = true;

// --- Service definition ---
service EnergyDistributionService {
  rpc GetGridStatus (Empty) returns (GridStatusResponse);
  rpc NegotiateDistribution (stream DistributionRequest) returns (stream DistributionResponse);
}

// --- Messages ---
message Empty {
}

message GridStatusResponse {
  double demand = 1;
  double supply = 2;
  repeated SourceStatus registered_sources = 3;
  repeated DistributionResponse current_allocations = 4;
}

message SourceStatus {
  string source_id = 1;        // ID of a solar panel or battery that has registered an offer
  double watts_offered = 2;    // most recent amount that source offered, in watts
}

message DistributionRequest {
  string source_id = 1;        // panel or battery ID supplying energy
  double watts_offered = 2;
}

message DistributionResponse {
  string appliance_id = 1;     // appliance receiving allocation
  double watts_allocated = 2;  // watts covered by solar/battery supply
  bool grid_import_needed = 3; // true if solar/battery insufficient
  double watts_from_grid = 4;  // watts this appliance must draw from the national grid
}

